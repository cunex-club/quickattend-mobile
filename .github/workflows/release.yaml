name: Release

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build.yaml

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Semantic Release

    outputs:
      release_version: ${{ steps.semantic_release.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up PNPM
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Semantic Release
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm dlx --package @semantic-release/changelog \
            --package @semantic-release/git \
            --package @semantic-release/exec \
            semantic-release --ci
          VERSION=$(cat VERSION || echo "")
          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  docker-prod:
    needs: release
    runs-on: ubuntu-latest
    name: Build and Push Docker Image (Production)
    environment:
      name: Production
      deployment: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            ${{ needs.release.outputs.release_version && format('type=raw,value={0}', needs.release.outputs.release_version) || '' }}
            type=raw,value=latest
            ${{ github.ref_name == 'main' && 'type=raw,value=main' || '' }}
            ${{ github.ref_name == 'dev' && 'type=raw,value=dev' || '' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_BASE_API_PRODUCTION=${{ vars.NEXT_PUBLIC_BASE_API_PRODUCTION }}
            NEXT_PUBLIC_BACKOFFICE_PATH=${{ vars.NEXT_PUBLIC_BACKOFFICE_PATH }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-dev:
    needs: release
    runs-on: ubuntu-latest
    name: Build and Push Docker Image (Development)
    environment:
      name: Development
      deployment: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            ${{ needs.release.outputs.release_version && format('type=raw,value={0}-dev', needs.release.outputs.release_version) || '' }}
            type=raw,value=latest-dev
            ${{ github.ref_name == 'main' && 'type=raw,value=main-dev' || '' }}
            ${{ github.ref_name == 'dev' && 'type=raw,value=dev-dev' || '' }}
            type=sha,format=short,suffix=-dev

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_BASE_API_PRODUCTION=${{ vars.NEXT_PUBLIC_BASE_API_PRODUCTION }}
            NEXT_PUBLIC_BACKOFFICE_PATH=${{ vars.NEXT_PUBLIC_BACKOFFICE_PATH }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
